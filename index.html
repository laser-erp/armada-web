<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>АРМАДА — учёт перевозок</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <style>
    :root {
      --bg0:#000; --bg1:#1e1e1e; --accent:#e61a1f; --bot:#2e2e2e;
      --text:#f5f5f5; --muted:rgba(245,245,245,.72); --field:rgba(255,255,255,.1); --ink:#111;
    }
    *{box-sizing:border-box} html,body{margin:0;height:100%;font-family:"Segoe UI","Trebuchet MS",sans-serif;background:#000;color:var(--text)}
    .phone{max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--bg0),var(--bg1));position:relative}
    .phone.wide{max-width:100%}
    .screen{position:absolute;inset:0;display:none;flex-direction:column;background:linear-gradient(160deg,var(--bg0),var(--bg1))}
    .screen.show{display:flex}
    /* Полноэкранные панели внутри водителя — поверх чата */
    .driver-panel{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;background:linear-gradient(160deg,var(--bg0),var(--bg1))}
    .driver-panel.show{display:flex}
    .driver-panel header{background:rgba(0,0,0,.92);position:sticky;top:0;z-index:2}
    .driver-panel .panel-body{background:transparent;flex:1;min-height:0}
    .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
    .logo{width:120px;height:auto}
    .brand{font-size:2rem;font-weight:800;letter-spacing:.25em}
    .sub{color:var(--muted)}
    button.primary,button.secondary{width:100%;border:0;border-radius:16px;padding:14px 12px;font-size:1rem;font-weight:700;cursor:pointer}
    button.primary{background:var(--accent);color:#fff}
    button.secondary{background:var(--field);color:var(--text)}
    .stack{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px}
    header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.1);gap:8px;flex-wrap:wrap}
    header h1{margin:0;font-size:1.05rem}
    header button{background:0;border:0;color:var(--accent);font-weight:700;cursor:pointer;white-space:nowrap}
    #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
    .bubble{max-width:86%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;line-height:1.35}
    .bot{align-self:flex-start;background:var(--bot)}
    .driver{align-self:flex-end;background:var(--accent);color:#fff;font-weight:600}
    #input-bar{padding:10px 12px 16px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:8px;background:rgba(0,0,0,.9)}
    .error{color:#ff8d8d;font-size:.82rem}.hint{color:var(--muted);font-size:.8rem}
    .row{display:flex;gap:8px}
    .row input,.row textarea,.row select,.pin input,
    .form-grid input,.form-grid select,.form-grid textarea,
    .admin-form-scroll input,.admin-form-scroll select,.admin-form-scroll textarea{
      border:0;border-radius:14px;padding:12px;background:var(--field);color:var(--text);font-size:1rem;outline:0;font-family:inherit
    }
    .row input,.row textarea,.row select{flex:1;min-width:0}
    .row button{border:0;border-radius:14px;padding:0 16px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
    .nums,.yesno{display:flex;gap:8px}
    .nums button,.yesno button{flex:1;border:0;border-radius:12px;padding:12px 0;background:var(--field);color:var(--text);font-weight:700;cursor:pointer}
    .panel-body{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
    .card{background:rgba(46,46,46,.9);border-radius:14px;padding:12px 14px}
    .card h3{margin:0 0 4px;font-size:1rem}.card p{margin:0;color:var(--muted);font-size:.85rem}
    .empty{color:var(--muted);text-align:center;margin-top:40px}
    .pin{width:100%;max-width:280px;display:flex;flex-direction:column;gap:10px}
    .filters{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap}
    .filters button{border:0;border-radius:10px;padding:8px 12px;background:var(--field);color:var(--text);font-weight:700;cursor:pointer;font-size:.85rem}
    .filters button.on{background:var(--accent);color:#fff}
    .table-wrap{flex:1;overflow:auto;padding:0 0 16px}
    table.admin{border-collapse:collapse;min-width:1800px;font-size:12px}
    table.admin th,table.admin td{border:1px solid rgba(255,255,255,.08);padding:8px 6px;text-align:left;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
    table.admin th{position:sticky;top:0;background:#1a1a1a;color:var(--accent);z-index:1}
    table.admin tr{cursor:pointer}
    table.admin tr:hover td{background:rgba(230,26,31,.12)}
    .form-grid{display:flex;flex-direction:column;align-items:stretch;gap:8px;width:100%;max-width:520px;margin:0 auto;padding:16px 16px 40px;text-align:left;direction:ltr}
    .form-grid label,.admin-form-scroll label{display:block;width:100%;font-size:.8rem;color:var(--muted);text-align:left;unicode-bidi:isolate}
    .form-grid input,.form-grid select,.form-grid textarea,
    .admin-form-scroll input,.admin-form-scroll select,.admin-form-scroll textarea{width:100%;max-width:100%;align-self:stretch;flex:0 0 auto}
    /* Админ-формы: экран не сжимает контент — скролл внутри body */
    #admin-detail,#admin-create,#admin-catalogs-screen{
      overflow:hidden; min-height:0;
    }
    .admin-form-shell{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:520px;margin:0 auto}
    .admin-form-scroll{
      flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
      padding:16px 18px 24px;display:flex;flex-direction:column;align-items:stretch;gap:10px;
      text-align:left;direction:ltr;width:100%;max-width:100%;margin:0;box-sizing:border-box
    }
    .admin-form-scroll > *{max-width:100%}
    .admin-form-scroll label{
      display:block;width:100%;margin:0;padding:0;
      font-size:.85rem;line-height:1.3;color:var(--muted);
      text-align:left;unicode-bidi:isolate
    }
    .admin-form-actions{flex-shrink:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0));border-top:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.92);display:flex;flex-direction:column;gap:8px}
    .admin-form-scroll h2,.admin-form-scroll h3{margin:0 0 4px;font-size:1.15rem;text-align:left;width:100%}
    .field-block{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);width:100%}
    .field-block:last-child{border-bottom:0}
    .calc{background:rgba(46,46,46,.9);border-radius:12px;padding:10px 12px;font-size:.9rem;width:100%;text-align:left;direction:ltr}
    .calc .calc-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:3px 0;width:100%}
    .calc .calc-row span:first-child{flex:1;min-width:0;text-align:left}
    .calc .calc-row span:last-child{flex:0 1 auto;text-align:right;white-space:nowrap}
    .calc .hint{display:block;width:100%;text-align:left;white-space:normal}
    .ok{color:#7dffa0;font-size:.85rem}
    .admin-cards{display:flex;flex-direction:column;gap:10px;padding:12px 16px 24px}
    .admin-cards .card button{margin-top:10px}
    .rate-missing{color:#ffb4b4;font-size:.82rem;font-weight:700}
    .swipe-item{position:relative;overflow:hidden;border-radius:14px;touch-action:pan-y}
    .swipe-actions{position:absolute;inset:0 0 0 auto;display:flex;z-index:0}
    .swipe-actions button{border:0;background:var(--accent);color:#fff;font-weight:700;padding:0 16px;min-width:118px;cursor:pointer}
    .swipe-front{position:relative;z-index:1;background:rgba(46,46,46,.96);border-radius:14px;padding:12px 14px;transition:transform .18s ease;will-change:transform}
    .swipe-front h3{margin:0 0 4px;font-size:1rem}
    .swipe-front p{margin:0;color:var(--muted);font-size:.85rem}
    .orders-hint{color:var(--muted);font-size:.8rem;padding:0 2px 4px}
  </style>
</head>
<body>
<div class="phone" id="shell">
  <div id="splash" class="screen show"><div class="center">
    <img class="logo" src="logo.png" alt="АРМАДА" />
    <div class="brand">АРМАДА</div>
    <div class="sub">Учёт перевозок</div>
  </div></div>

  <div id="roles" class="screen"><div class="center">
    <img class="logo" src="logo.png" alt="АРМАДА" />
    <div class="brand">АРМАДА</div>
    <div class="sub">Выберите роль</div>
    <div class="hint" id="sync-hint" style="margin-bottom:8px">Подключение к общей базе…</div>
    <div class="stack">
      <button class="primary" id="role-driver">Водитель</button>
      <button class="secondary" id="role-admin">Администратор</button>
    </div>
  </div></div>

  <div id="admin-pin" class="screen"><div class="center">
    <div class="sub" style="align-self:stretch;text-align:left"><button id="pin-back" style="background:0;border:0;color:var(--accent);font-weight:700">Назад</button></div>
    <h2 style="margin:0">Вход администратора</h2>
    <div class="sub">Введите PIN</div>
    <div class="pin">
      <input id="pin-input" inputmode="numeric" maxlength="8" placeholder="••••" />
      <div class="error" id="pin-error"></div>
      <button class="primary" id="pin-ok">Войти</button>
    </div>
  </div></div>

  <div id="admin" class="screen">
    <header>
      <button id="admin-exit">Выход</button>
      <h1>Таблица заявок</h1>
      <div>
        <button id="admin-catalogs">Справочники</button>
        <button id="admin-new">+ Заказ</button>
      </div>
    </header>
    <div class="filters" id="admin-filters">
      <button data-filter="all" class="on">Все</button>
      <button data-filter="assigned">Назначен</button>
      <button data-filter="progress">В работе</button>
      <button data-filter="closed">Закрыт</button>
    </div>
    <div class="table-wrap" id="admin-list"></div>
  </div>

  <div id="admin-create" class="screen">
    <div class="admin-form-shell">
      <div class="admin-form-scroll">
        <button id="create-back" class="secondary">← Назад</button>
        <h2>Назначить заказ</h2>
        <div class="hint">Прокрутите вниз — кнопка «Назначить» всегда внизу экрана</div>
        <div class="field-block">
          <label>Номер за день</label>
          <div class="nums" id="create-day"><button data-cday="1">1</button><button data-cday="2">2</button><button data-cday="3">3</button><button data-cday="4">4</button><button data-cday="5">5</button></div>
        </div>
        <div class="field-block">
          <label>Автомобиль</label>
          <select id="create-plate"></select>
          <label>Водитель</label>
          <select id="create-driver"></select>
        </div>
        <div class="field-block">
          <label>Заказчик</label>
          <input id="create-customer" list="customer-list" placeholder="Имя заказчика" />
          <select id="create-customer-pick"><option value="">или выбрать сохранённого</option></select>
          <datalist id="customer-list"></datalist>
        </div>
        <div class="field-block">
          <label>Адрес загрузки</label>
          <textarea id="create-load" rows="2" placeholder="Город, улица, дом"></textarea>
          <select id="create-load-pick"><option value="">или из сохранённых</option></select>
        </div>
        <div class="field-block">
          <label>Адрес выгрузки</label>
          <textarea id="create-unload" rows="2" placeholder="Город, улица, дом"></textarea>
          <select id="create-unload-pick"><option value="">или из сохранённых</option></select>
        </div>
      </div>
      <div class="admin-form-actions">
        <div class="error" id="create-error"></div>
        <button class="primary" id="create-save">Назначить водителю</button>
      </div>
    </div>
  </div>

  <div id="admin-detail" class="screen">
    <div class="admin-form-shell">
      <div class="admin-form-scroll" id="detail-form"></div>
      <div class="admin-form-actions" id="detail-actions" style="display:none">
        <div class="ok" id="detail-ok" style="display:none">Сохранено — маршрут и ЗП обновлены</div>
        <button class="primary" id="detail-save">Сохранить</button>
      </div>
    </div>
  </div>

  <div id="admin-catalogs-screen" class="screen">
    <div class="admin-form-shell">
      <div class="admin-form-scroll" id="catalogs-form"></div>
    </div>
  </div>

  <div id="driver" class="screen">
    <header>
      <button id="driver-exit">Выход</button>
      <h1>Водитель</h1>
      <div>
        <button id="btn-cabinet">Кабинет</button>
        <button id="btn-orders">Заявки</button>
        <button id="btn-shifts">Смены</button>
      </div>
    </header>
    <div id="chat"></div>
    <div id="input-bar"></div>
    <div id="cabinet-panel" class="driver-panel">
      <header><button type="button" class="back-driver">← Назад</button><h1>Личный кабинет</h1><span></span></header>
      <div class="panel-body" id="cabinet-list"></div>
    </div>
    <div id="orders-panel" class="driver-panel">
      <header><button type="button" class="back-driver">← Назад</button><h1>Заявки</h1><span></span></header>
      <div class="panel-body" id="orders-list"></div>
    </div>
    <div id="shifts-panel" class="driver-panel">
      <header><button type="button" class="back-driver">← Назад</button><h1>Смены</h1><span></span></header>
      <div class="panel-body" id="shifts-list"></div>
    </div>
  </div>
</div>
<script>
const DEFAULT_VEHICLES=[{plate:"О 535 МВ 198",consumptionPer100Km:20},{plate:"М 277 НО 198",consumptionPer100Km:20}];
const DEFAULT_DRIVERS=[{name:"Наволоцкий Е.Н.",salaryPercent:30}];
const FLUIDS=["Максимум","Середина","Минимум"];
const DRIVER="Наволоцкий Е.Н.";
const ADMIN_PIN="2580";
const APP_BUILD="2026-08-03-pb-sync";
const KEY="armada_app_v5";
const OLD_KEY="armada_app_v4";
/** Общая база на VPS; с GitHub Pages тоже ходим сюда (нужен HTTP-сайт приложения). */
const PB_BASE=(function(){
  const h=location.hostname;
  if(h==='aptown1.fvds.ru'||h==='176.12.67.35') return location.origin;
  return 'http://aptown1.fvds.ru';
})();
console.info("АРМАДА build", APP_BUILD, "PB", PB_BASE);
const saved=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY)||"{}");
const DEFAULT_FINANCE={markupPercent:15,cityKmThreshold:100,minWorkHours:4,podachaHours:1,defaultRatePerHourWork:0,defaultRatePerKmCash:0};
const state={
  step:"idle", orderStep:"idle", messages:[], shift:null,
  shifts:saved.shifts||[], orders:saved.orders||[], seq:saved.seq||0,
  vehicles:saved.vehicles&&saved.vehicles.length?saved.vehicles:DEFAULT_VEHICLES.map(v=>({...v})),
  drivers:saved.drivers&&saved.drivers.length?saved.drivers:DEFAULT_DRIVERS.map(d=>({...d})),
  customers:Array.isArray(saved.customers)?saved.customers:[],
  finance:Object.assign({}, DEFAULT_FINANCE, saved.finance||{}),
  light:{}, draft:{}, error:"", adminFilter:"all", detailId:null
};
let pbRecordId=null;
let persistTimer=null;
let syncStatus='local'; // local | syncing | ok | error
if(!(state.finance.markupPercent>=0)) state.finance.markupPercent=15;
if(state.finance.markupPercent>80) state.finance.markupPercent=80;
if(!(state.finance.cityKmThreshold>0)) state.finance.cityKmThreshold=100;
if(!(state.finance.minWorkHours>=0)) state.finance.minWorkHours=4;
if(!(state.finance.podachaHours>=0)) state.finance.podachaHours=1;
if(!(state.finance.defaultRatePerHourWork>=0)) state.finance.defaultRatePerHourWork=0;
if(!(state.finance.defaultRatePerKmCash>=0)) state.finance.defaultRatePerKmCash=0;
if(!state.orders.length && state.shifts.length){ state.orders = state.shifts.flatMap(s => s.orders||[]); }
function kindTitle(kind){ return kind==='unloading'?'Выгрузка':'Загрузка'; }
function normalizePoint(p, fallbackKind){
  if(typeof p==='string'){
    const address=String(p||'').trim();
    return address?{id:crypto.randomUUID(),address,kind:fallbackKind||'loading'}:null;
  }
  if(!p||typeof p!=='object') return null;
  const address=String(p.address||'').trim();
  if(!address) return null;
  const kind=p.kind==='unloading'?'unloading':'loading';
  return {id:p.id||crypto.randomUUID(),address,kind};
}
function defaultRoutePoints(load, unload){
  return [
    {id:crypto.randomUUID(),address:String(load||'').trim()||'Адрес загрузки',kind:'loading'},
    {id:crypto.randomUUID(),address:String(unload||'').trim()||'Адрес выгрузки',kind:'unloading'}
  ];
}
function ensureRoutePoints(o){
  let raw=Array.isArray(o.routePoints)?o.routePoints:[];
  let pts=[];
  if(raw.length && typeof raw[0]==='string'){
    pts=raw.map((addr,i)=>normalizePoint(addr, i===raw.length-1?'unloading':'loading')).filter(Boolean);
  } else {
    pts=raw.map(p=>normalizePoint(p)).filter(Boolean);
  }
  if(pts.length<2) pts=defaultRoutePoints(o.loadingAddress, o.unloadingAddress);
  o.routePoints=pts;
  o.loadingAddress=(pts.find(p=>p.kind==='loading')||pts[0]).address;
  o.unloadingAddress=( [...pts].reverse().find(p=>p.kind==='unloading')||pts[pts.length-1]).address;
  return pts;
}
function routeText(o){
  return ensureRoutePoints(o).map(p=>`${kindTitle(p.kind)}: ${p.address}`).join(' → ');
}
state.orders.forEach(o=>{
  if(o.customer==null) o.customer="";
  if(o.driverPercent==null) o.driverPercent=driverPercent(o.driverName||DRIVER);
  ensureRoutePoints(o);
});
const $ = id => document.getElementById(id);
function show(id){
  document.querySelectorAll('.phone > .screen').forEach(s=>s.classList.remove('show'));
  $(id).classList.add('show');
  const wide = id==='admin'||id==='admin-detail'||id==='admin-create'||id==='admin-catalogs-screen';
  $('shell').classList.toggle('wide', wide);
}
function snapshot(){
  return {
    shifts:state.shifts,
    orders:state.orders,
    seq:state.seq,
    vehicles:state.vehicles,
    drivers:state.drivers,
    customers:state.customers,
    finance:state.finance,
    savedAt:new Date().toISOString()
  };
}
function scorePayload(p){
  if(!p||typeof p!=='object') return 0;
  return (p.orders&&p.orders.length||0)*10 + (p.shifts&&p.shifts.length||0)*3 + (p.customers&&p.customers.length||0) + (p.seq||0);
}
function applyPayload(p){
  if(!p||typeof p!=='object') return;
  state.shifts=Array.isArray(p.shifts)?p.shifts:[];
  state.orders=Array.isArray(p.orders)?p.orders:[];
  state.seq=p.seq||0;
  state.vehicles=(p.vehicles&&p.vehicles.length)?p.vehicles:DEFAULT_VEHICLES.map(v=>({...v}));
  state.drivers=(p.drivers&&p.drivers.length)?p.drivers:DEFAULT_DRIVERS.map(d=>({...d}));
  state.customers=Array.isArray(p.customers)?p.customers:[];
  state.finance=Object.assign({}, DEFAULT_FINANCE, p.finance||{});
  if(!(state.finance.markupPercent>=0)) state.finance.markupPercent=15;
  if(state.finance.markupPercent>80) state.finance.markupPercent=80;
  if(!(state.finance.cityKmThreshold>0)) state.finance.cityKmThreshold=100;
  if(!(state.finance.minWorkHours>=0)) state.finance.minWorkHours=4;
  if(!(state.finance.podachaHours>=0)) state.finance.podachaHours=1;
  if(!(state.finance.defaultRatePerHourWork>=0)) state.finance.defaultRatePerHourWork=0;
  if(!(state.finance.defaultRatePerKmCash>=0)) state.finance.defaultRatePerKmCash=0;
  if(!state.orders.length && state.shifts.length) state.orders=state.shifts.flatMap(s=>s.orders||[]);
  state.orders.forEach(o=>{
    if(o.customer==null) o.customer="";
    if(o.driverPercent==null) o.driverPercent=driverPercent(o.driverName||DRIVER);
    ensureRoutePoints(o);
  });
}
async function fetchServerState(){
  const filter=encodeURIComponent("key='main'");
  const res=await fetch(`${PB_BASE}/api/collections/app_state/records?filter=${filter}&perPage=1`);
  if(!res.ok) throw new Error('Не удалось загрузить базу ('+res.status+')');
  const data=await res.json();
  return (data.items&&data.items[0])||null;
}
async function pushServerState(){
  const payload=snapshot();
  localStorage.setItem(KEY, JSON.stringify(payload));
  const body={key:'main', payload};
  if(pbRecordId){
    const res=await fetch(`${PB_BASE}/api/collections/app_state/records/${pbRecordId}`,{
      method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
    });
    if(!res.ok) throw new Error('Не удалось сохранить ('+res.status+')');
    return;
  }
  const res=await fetch(`${PB_BASE}/api/collections/app_state/records`,{
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
  });
  if(res.ok){
    const rec=await res.json();
    pbRecordId=rec.id;
    return;
  }
  const existing=await fetchServerState();
  if(!existing) throw new Error('Не удалось создать запись базы');
  pbRecordId=existing.id;
  const res2=await fetch(`${PB_BASE}/api/collections/app_state/records/${pbRecordId}`,{
    method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
  });
  if(!res2.ok) throw new Error('Не удалось сохранить ('+res2.status+')');
}
function persist(){

    `:`<div class="hint">Задайте руб/км, руб/час и/или хранение — появится сумма</div>`}
  `;

function variableShare(driverPercent){ return driverPercent/100 + 0.10; }
function fixedCosts(fuelCost, rent, bonus){ return (fuelCost||0)+(rent||0)+(bonus||0); }
function breakEvenRate(fixed, driverPercent){
  const den=1-variableShare(driverPercent);
  if(den<=0.01) return null;
  return round2(fixed/den);
}
function recommendedRate(fixed, driverPercent, markupPercent){
  const den=1-variableShare(driverPercent)-(markupPercent||0)/100;
  if(den<=0.01) return null;
  return round2(fixed/den);
}
function totalCostAtRate(rate, fuelCost, rent, driverPercent, bonus){
  const pay=rate*driverPercent/100+bonus;
  const cush=rate*0.1;
  return round2((fuelCost||0)+rent+pay+cush);
}
function metrics(o){
  const cons=vehicle(o.vehiclePlate).consumptionPer100Km;
  const km=kmParkingToEnd(o);
  const fuelLitersCalc=km==null?null:round2(km*cons/100);
  const price=o.fuelPricePerLiter;
  const fuelCostCalc=(fuelLitersCalc!=null && price!=null)?round2(fuelLitersCalc*price):(o.fuelTotalCost??null);
  const rate=selectedRate(o);
  const payBase=payrollRate(o);
  const cushion=payBase==null?null:round2(payBase*0.1);
  const bonus=o.salaryBonus||0;
  const percent=o.driverPercent??driverPercent(o.driverName||DRIVER);
  const driverPay=payBase==null?null:round2(payBase*percent/100+bonus);
  const rent=o.vehicleRent||0;
  const fuel=fuelCostCalc||0;
  const fixed=round2(fixedCosts(fuel, rent, bonus));
  const markup=state.finance.markupPercent??15;
  const be=breakEvenRate(fixed, percent);
  const rec=recommendedRate(fixed, percent, markup);
  const totalCost=payBase==null?null:totalCostAtRate(payBase, fuel, rent, percent, bonus);
  const netProfit=(rate!=null && driverPay!=null && cushion!=null)?round2(rate-driverPay-cushion-fuel-rent):null;
  const costPerKmNoVat=(o.rateWithoutVat!=null && o.loadedKm>0)?round2(o.rateWithoutVat/o.loadedKm):null;
  return {km,fuelLitersCalc,fuelCostCalc,rate,cushion,driverPay,costPerKmNoVat,netProfit,cons,percent,fixedCosts:fixed,totalCost,breakEvenRate:be,recommendedRate:rec,markupPercent:markup};
}

function resumeOpenShift(shift){
  state.shift=shift;
  state.messages=(shift.messages&&shift.messages.length)?shift.messages.slice():[];
  state.orderStep='idle'; state.draft={}; state.error='';
  const stale=invalidateStaleEto(shift);
  state.light=shift.light||{};
  if(isEtoDone(shift)){
    state.step='done';
    const noted=(state.messages||[]).some(m=>String(m.text||'').includes('Смена уже открыта')||String(m.text||'').includes('Продолжаем открытую смену')||String(m.text||'').includes('ЕТО пройден'));
    if(!state.messages.length){
      state.messages=[{author:'bot',text:`Продолжаем открытую смену от ${dateTime(shift.startedAt)}.`}];
    } else if(!noted){
      const carry=inProgressOrder();
      const carryHint=carry&&carry.staysLoadedOvernight
        ? `\nЕсть перенесённый заказ №${carry.sequentialNumber} (машина загружена) — после работы закройте его.`
        : '';
      state.messages.push({author:'bot',text:`Смена уже открыта (${shift.vehiclePlate||'авто'}). ЕТО на сегодня пройден — можно работать с заказами или закрыть смену.${carryHint}`});
    }
    upsertShift(); persist(); renderChat(); return;
  }
  if(!shift.vehiclePlate) state.step='chooseVehicle';
  else if(shift.odometer==null) state.step='odometer';
  else if(shift.fuelLiters==null) state.step='fuel';
  else if(!(shift.gur||shift.powerSteeringLevel)) state.step='gur';
  else if(!(shift.coolant||shift.coolantLevel)) state.step='coolant';
  else if(!state.light.lowBeam || !state.light.brake || !state.light.turn) state.step='lights';
  else state.step='oil';
  const carry=inProgressOrder();
  const carryHint=carry&&carry.staysLoadedOvernight
    ? ` Есть перенесённый заказ №${carry.sequentialNumber} (машина загружена) — закроете после выгрузки.`
    : '';
  if(stale){
    state.messages.push({author:'bot',text:`Новый день — нужно пройти ЕТО заново (за ночь с машиной могло что-то измениться).${carryHint}`});
  } else if(!state.messages.length){
    state.messages=[{author:'bot',text:`Смена открыта, но ЕТО не завершён. Продолжим с того места, где остановились.${carryHint}`}];
  } else if(carryHint && !(state.messages||[]).some(m=>String(m.text||'').includes('перенесённый заказ'))){
    state.messages.push({author:'bot',text:carryHint.trim()});
  }
  upsertShift(); persist(); renderChat();
}

    state.draft.fuelPrice=price; add('driver',`${price} ₽/л`); add('bot','Укажите количество литров.');

    state.draft.parkingAfterOdo=value; add('driver',String(value));
    finalizeClose(!!state.draft.closeRefueled, state.draft.fuelPrice||null, state.draft.closeLiters||null); return;
  }
  if(state.step==='odometer'){
    const digits=raw.replace(/\D/g,''); if(!digits){state.error='Введите целое число километров';renderInput();return;}
    const value=+digits; state.shift.odometer=value; state.shift.lastOdometerPoint=value;
    add('driver',String(value)); add('bot','Введите остаток топлива в литрах.'); state.step='fuel';
  } else if(state.step==='fuel'){
    const value=+raw; if(!(value>=0)){state.error='Введите остаток топлива в литрах';renderInput();return;}
    state.shift.fuelLiters=value;
    add('driver',`${value} л`);
    add('bot','Проверьте и укажите уровень жидкости ГУР:\n• Максимум\n• Середина\n• Минимум'); state.step='gur';
  }
  state.error=''; upsertShift(); renderInput();
}

function beginAssigned(id, fromOrders){

  }
  const order=state.orders.find(o=>o.id===id);
  if(!order||order.closedAt||order.startOdometer!=null){
    const msg='Заказ недоступен для старта';
    if(fromOrders){ showOrdersError(msg); return false; }
    state.error=msg; renderInput(); return false;
  }
  syncOpenShiftRuntime();
  hideDriverPanels();
  state.draft.assignedId=id; add('driver',`Начать заказ №${order.sequentialNumber}`);
  add('bot',`Заказ №${order.sequentialNumber} (день ${order.dayNumber})\nАвто: ${order.vehiclePlate}\nМаршрут: ${routeText(order)}\nУкажите показания одометра по прибытию на загрузку.`);

function acceptStartAssigned(value){
  const order=state.orders.find(o=>o.id===state.draft.assignedId); if(!order){ state.error='Заказ не найден'; renderInput(); return; }
  const prev=state.shift.lastOdometerPoint??state.shift.odometer;
  if(prev==null){ state.error='Нет одометра смены'; renderInput(); return; }
  if(value<prev){ state.error=`Одометр не может быть меньше предыдущего (${prev})`; renderInput(); return; }
  order.startOdometer=value; order.previousOdometer=prev; order.emptyKmBefore=value-prev;
  if(!state.shift.orders) state.shift.orders=[];
  if(!state.shift.orders.some(o=>o.id===order.id)) state.shift.orders.push(order);
  upsertOrder(order); add('driver',String(value));
  add('bot',`Заявка в работе🔔\n\n№${order.sequentialNumber} · день ${order.dayNumber}\n${routeText(order)}\nОдометр: ${value}`);
  add('bot','Когда перевозка закончится — нажмите «Закрыть заказ».');

function startCloseShift(){

function acceptCloseShiftParking(value){
  const prev=state.shift.lastOdometerPoint??state.shift.odometer;
  if(prev!=null && value<prev){ state.error=`Одометр не может быть меньше предыдущего (${prev})`; renderInput(); return; }

function wireOrdersSwipe(){
  const ACTION_W=118;
  document.querySelectorAll('#orders-list .swipe-item').forEach(item=>{
    const front=item.querySelector('.swipe-front');
    if(!front || item.dataset.canStart!=='1') return;
    let startX=0, startY=0, dx=0, tracking=false, horizontal=false;
    const setX=(x)=>{ front.style.transform=`translateX(${x}px)`; };
    const closeOthers=()=>{
      document.querySelectorAll('#orders-list .swipe-item').forEach(other=>{
        if(other===item) return;
        const f=other.querySelector('.swipe-front');
        if(f){ f.style.transform='translateX(0)'; other.dataset.open='0'; }
      });
    };
    front.addEventListener('touchstart',e=>{
      const t=e.changedTouches[0]; startX=t.clientX; startY=t.clientY; dx=0; tracking=true; horizontal=false;
    },{passive:true});
    front.addEventListener('touchmove',e=>{
      if(!tracking) return;
      const t=e.changedTouches[0];
      const adx=t.clientX-startX, ady=t.clientY-startY;
      if(!horizontal){
        if(Math.abs(adx)<8 && Math.abs(ady)<8) return;
        if(Math.abs(ady)>Math.abs(adx)){ tracking=false; return; }
        horizontal=true; closeOthers();
      }
      dx=Math.min(0, Math.max(-ACTION_W, adx));
      setX(dx);
    },{passive:true});
    front.addEventListener('touchend',()=>{
      if(!tracking && !horizontal) return;
      tracking=false;
      const open=dx<-ACTION_W*0.4;
      setX(open?-ACTION_W:0);
      item.dataset.open=open?'1':'0';
      dx=open?-ACTION_W:0;
    });
    // mouse (desktop preview)
    front.addEventListener('mousedown',e=>{
      startX=e.clientX; startY=e.clientY; dx=0; tracking=true; horizontal=false;
      const move=ev=>{
        if(!tracking) return;
        const adx=ev.clientX-startX, ady=ev.clientY-startY;
        if(!horizontal){
          if(Math.abs(adx)<6 && Math.abs(ady)<6) return;
          if(Math.abs(ady)>Math.abs(adx)){ tracking=false; return; }
          horizontal=true; closeOthers();
        }
        dx=Math.min(0, Math.max(-ACTION_W, adx));
        setX(dx);
      };
      const up=()=>{
        document.removeEventListener('mousemove',move);
        document.removeEventListener('mouseup',up);
        if(!tracking && !horizontal) return;
        tracking=false;
        const open=dx<-ACTION_W*0.4;
        setX(open?-ACTION_W:0);
        item.dataset.open=open?'1':'0';
      };
      document.addEventListener('mousemove',move);
      document.addEventListener('mouseup',up);
    });
  });
  document.querySelectorAll('#orders-list .swipe-start').forEach(btn=>{
    btn.onclick=()=>beginAssigned(btn.dataset.id, true);
  });
}

          <input data-route-addr value="${esc(p.address||'')}" placeholder="Город, улица, дом" />
          ${sug.length?`<select data-route-sug="${i}"><option value="">— сохранённые —</option>${sug.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('')}</select>`:''}
          <div class="row" style="margin:4px 0 0">
            <button type="button" class="secondary" data-route-up="${i}" ${i===0?'disabled':''}>↑</button>
            <button type="button" class="secondary" data-route-down="${i}" ${i>=editPoints.length-1?'disabled':''}>↓</button>
            ${editPoints.length>2?`<button type="button" class="secondary" data-route-del="${i}">Удалить</button>`:''}
          </div>
        </div>`;}).join('')}
      <div class="row">
        <button type="button" class="secondary" id="route-add-load">+ Загрузка</button>
        <button type="button" class="secondary" id="route-add-unload">+ Выгрузка</button>
      </div>
      <div class="error" id="route-error" style="display:none"></div>
    `;
    document.querySelectorAll('[data-route-sug]').forEach(sel=>{
      sel.onchange=()=>{
        const i=+sel.dataset.routeSug;
        if(!sel.value) return;
        editPoints=readPointsFromDom();
        editPoints[i].address=sel.value;
        renderRouteEditor();
      };
    });
    document.querySelectorAll('[data-route-kind]').forEach(sel=>{
      sel.onchange=()=>{ editPoints=readPointsFromDom(); renderRouteEditor(); };
    });
    const addKind=kind=>{
      editPoints=readPointsFromDom();
      const insertAt=Math.max(1, editPoints.length-1);
      editPoints.splice(insertAt, 0, {id:crypto.randomUUID(),address:'',kind});
      renderRouteEditor();
    };
    $('route-add-load').onclick=()=>addKind('loading');
    $('route-add-unload').onclick=()=>addKind('unloading');
    document.querySelectorAll('[data-route-up]').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.routeUp;
      editPoints=readPointsFromDom();
      if(i<=0) return;
      const t=editPoints[i-1]; editPoints[i-1]=editPoints[i]; editPoints[i]=t;
      renderRouteEditor();
    });
    document.querySelectorAll('[data-route-down]').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.routeDown;
      editPoints=readPointsFromDom();
      if(i>=editPoints.length-1) return;
      const t=editPoints[i+1]; editPoints[i+1]=editPoints[i]; editPoints[i]=t;
      renderRouteEditor();
    });
    document.querySelectorAll('[data-route-del]').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.routeDel;
      editPoints=readPointsFromDom();
      if(editPoints.length<=2) return;
      editPoints.splice(i,1);
      renderRouteEditor();
    });
  };
  $('detail-form').innerHTML=`
    <button class="secondary" id="detail-back">← Назад</button>
    <h2>Заявка №${o.sequentialNumber}</h2>
    <div class="hint">${statusText(o)} · день ${o.dayNumber} · ${esc(o.driverName)} (${m.percent}%)</div>
    <div class="hint" style="color:var(--accent)">База для клиента — руб/км наличными. Сумма = руб/км × км. Без НДС и с НДС считаются от нал.</div>
    <div class="field-block">
      <label for="d-customer">Заказчик</label>
      <input id="d-customer" list="detail-customer-list" value="${esc(o.customer||'')}" placeholder="Введите имя заказчика" />
      <datalist id="detail-customer-list">${customerNames().map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist>
      <select id="d-customer-pick"><option value="">или выбрать сохранённого</option>${customerNames().map(n=>`<option value="${esc(n)}" ${n===o.customer?'selected':''}>${esc(n)}</option>`).join('')}</select>
    </div>
    <div class="field-block">
      <h3>Маршрут</h3>
      <div id="route-editor"></div>
      <label for="d-empty-after">Пробег до стоянки, км</label>
      <input id="d-empty-after" inputmode="numeric" value="${o.emptyKmAfter??''}" placeholder="например 40" />
    </div>
    <div class="field-block">
      <h3>Тариф клиенту</h3>
      <div class="hint">Город до ${state.finance.cityKmThreshold} км: мин ${state.finance.minWorkHours} ч + подача ${state.finance.podachaHours} ч. Если нулевой × руб/км больше подачи — добавляем руб/км нулевого.</div>
      <label for="d-perkm">руб/км наличные</label>
      <input id="d-perkm" inputmode="decimal" value="${o.ratePerKmCash??''}" placeholder="например 50" />
      <label for="d-perhour">руб/час работы</label>
      <input id="d-perhour" inputmode="decimal" value="${o.ratePerHourWork??''}" placeholder="например 2000" />
      <label for="d-estimate-km">Ориентир км (цепочка)</label>
      <input id="d-estimate-km" inputmode="numeric" value="${o.estimateKm??''}" placeholder="например 80" />
      <label for="d-estimate-hours">Ориентир часов работы</label>
      <input id="d-estimate-hours" inputmode="decimal" value="${o.estimateWorkHours??''}" placeholder="например 4" />
      <label for="d-work-hours">Факт часов работы</label>
      <input id="d-work-hours" inputmode="decimal" value="${o.workHours??''}" placeholder="после закрытия" />
      <h3>Ночное хранение груза</h3>
      <div class="hint">Ответственность за груз ночью. В сумму клиенту входит; в ЗП водителя — нет. При «осталась загружена» число ночей +1.</div>
      ${(o.staysLoadedOvernight||(o.overnightNights>0))?`<div class="hint" style="color:var(--accent)">Ночёвка с грузом${o.overnightNights?`: ${o.overnightNights} ноч.`:''}</div>`:''}
      <label for="d-overnight-rate">₽ за ночь хранения (нал)</label>
      <input id="d-overnight-rate" inputmode="decimal" value="${o.overnightStorageRateCash??''}" placeholder="например 5000" />
      <label for="d-overnight-nights">Число ночей</label>
      <input id="d-overnight-nights" inputmode="numeric" value="${o.overnightNights??''}" placeholder="0" />
      <div class="calc" id="perkm-preview"></div>
    </div>
    <div class="field-block">
      <div class="hint">ЗП, подушка и прибыль всегда от ставки наличные. С НДС = без НДС +22%.</div>
      <label for="d-form">Форма для клиента (документы)</label>
      <select id="d-form">
        <option value="cash" ${o.paymentForm==='cash'||o.ratePerKmCash||!o.paymentForm?'selected':''}>Наличные</option>
        <option value="withVat" ${o.paymentForm==='withVat'?'selected':''}>С НДС</option>
        <option value="withoutVat" ${o.paymentForm==='withoutVat'?'selected':''}>Без НДС</option>
      </select>
      <label for="d-vat">Ставка с НДС, руб</label>
      <input id="d-vat" inputmode="decimal" value="${o.rateWithVat??''}" placeholder="считается от руб/км" />
      <label for="d-novat">Ставка без НДС, руб</label>
      <input id="d-novat" inputmode="decimal" value="${o.rateWithoutVat??''}" placeholder="считается от руб/км" />
      <label for="d-cash">Ставка наличные, руб</label>
      <input id="d-cash" inputmode="decimal" value="${o.rateCash??''}" placeholder="руб/км × км" />
      <label for="d-bonus">Доплата к ЗП, руб</label>
      <input id="d-bonus" inputmode="decimal" value="${o.salaryBonus??''}" placeholder="0" />
      <label for="d-rent">Аренда ТС, руб</label>
      <input id="d-rent" inputmode="decimal" value="${o.vehicleRent??''}" placeholder="0" />
    </div>
    <div class="calc">
      <div class="calc-row"><span>Нулевой</span><span>${fmt(o.emptyKmBefore)} км</span></div>
      <div class="calc-row"><span>С грузом</span><span>${fmt(o.loadedKm)} км</span></div>
      <div class="calc-row"><span>От стоянки до конца</span><span>${fmt(m.km)} км</span></div>
      <div class="calc-row"><span>Норма авто</span><span>${fmt(m.cons)} л/100</span></div>
      <div class="calc-row"><span>ГСМ по заказу</span><span>${fmt(m.fuelLitersCalc)} л</span></div>
      <div class="calc-row"><span>Заправка</span><span>${o.refueled?`${fmt(o.fuelLiters)} л`:'нет'}</span></div>
      <div class="calc-row"><span>Остаток топлива</span><span>${fmt(o.fuelRemainingLiters)} л</span></div>
      <div class="calc-row"><span>руб/л (факт)</span><span>${fmt(o.fuelPricePerLiter)}</span></div>
      <div class="calc-row"><span>Стоимость ГСМ</span><span>${fmt(m.fuelCostCalc)} руб</span></div>
      <div class="calc-row"><span>руб/км без НДС</span><span>${fmt(m.costPerKmNoVat)}</span></div>
      <div class="calc-row"><span>Подушка 10%</span><span>${fmt(m.cushion)} руб</span></div>
      <div class="calc-row"><span>ЗП водителя</span><span>${fmt(m.driverPay)} руб</span></div>
      <div class="calc-row"><span>Чистая прибыль</span><span>${fmt(m.netProfit)} руб</span></div>
      <div class="hint" style="margin-top:8px">Себестоимость / ставка</div>
      <div class="calc-row"><span>Себестоимость (фикс)</span><span>${fmt(m.fixedCosts)} руб</span></div>
      <div class="calc-row"><span>Полная себестоимость</span><span>${fmt(m.totalCost)} руб</span></div>
      <div class="calc-row"><span>Безубыток</span><span>${fmt(m.breakEvenRate)} руб</span></div>
      <div class="calc-row"><span>Рекомендация +${Math.round(m.markupPercent)}%</span><span>${fmt(m.recommendedRate)} руб</span></div>
    </div>
  `;
  show('admin-detail');
  const detailScroll=$('detail-form'); if(detailScroll) detailScroll.scrollTop=0;
  const detailActions=$('detail-actions'); if(detailActions) detailActions.style.display='flex';
  const detailOk=$('detail-ok'); if(detailOk) detailOk.style.display='none';
  renderRouteEditor();
  wirePerKmInputs(o);
  wireRateAutoFill(o);
  $('d-customer-pick')&&($('d-customer-pick').onchange=()=>{
    if($('d-customer-pick').value){
      $('d-customer').value=$('d-customer-pick').value;
      renderRouteEditor();
    }
  });
  $('d-customer')&&($('d-customer').oninput=()=>renderRouteEditor());
  $('detail-back').onclick=()=>{ if(detailActions) detailActions.style.display='none'; show('admin'); renderAdmin(); };
  $('detail-save').onclick=()=>{
    const order=state.orders.find(x=>x.id===id); if(!order) return;
    const cleaned=readPointsFromDom().filter(p=>p.address);
    const err=$('route-error');
    const showErr=msg=>{ if(err){ err.style.display='block'; err.textContent=msg; } };
    if(cleaned.length<2){ showErr('Нужны минимум 2 точки маршрута с адресом'); return; }
    if(!cleaned.some(p=>p.kind==='loading')){ showErr('Добавьте хотя бы одну точку «Загрузка»'); return; }
    if(!cleaned.some(p=>p.kind==='unloading')){ showErr('Добавьте хотя бы одну точку «Выгрузка»'); return; }
    const num=el=>{ const v=($(el).value||'').trim().replace(',','.'); return v===''?null:Number(v); };
    order.customer=($('d-customer').value||'').trim();
    order.routePoints=cleaned;
    ensureRoutePoints(order);
    const after=($('d-empty-after').value||'').replace(/\D/g,'');
    order.emptyKmAfter=after?+after:null;
    const per=num('d-perkm');
    order.ratePerKmCash=(per!=null && per>0)?per:null;
    const hour=num('d-perhour');
    order.ratePerHourWork=(hour!=null && hour>0)?hour:null;
    const estRaw=(($('d-estimate-km')||{}).value||'').replace(/\D/g,'');
    order.estimateKm=estRaw?+estRaw:null;
    const eh=num('d-estimate-hours'); order.estimateWorkHours=(eh!=null&&eh>0)?eh:null;
    const wh=num('d-work-hours'); order.workHours=(wh!=null&&wh>0)?wh:null;
    const stor=num('d-overnight-rate'); order.overnightStorageRateCash=(stor!=null&&stor>0)?stor:null;
    const nightsRaw=(($('d-overnight-nights')||{}).value||'').replace(/\D/g,'');
    order.overnightNights=nightsRaw?+nightsRaw:null;
    order.paymentForm=$('d-form').value;
    if(!applyClientTariff(order)){
      const form=order.paymentForm;
      const seed = form==='withVat'?num('d-vat'):form==='cash'?num('d-cash'):num('d-novat');
      if(seed!=null && seed>0){
        const t=fillRatesFrom(form, seed);
        order.rateWithVat=t.withVat; order.rateWithoutVat=t.withoutVat; order.rateCash=t.cash;
      } else {
        order.rateWithVat=num('d-vat'); order.rateWithoutVat=num('d-novat'); order.rateCash=num('d-cash');
      }
    }
    order.salaryBonus=num('d-bonus'); order.vehicleRent=num('d-rent');
    order.freight=selectedRate(order);
    const pay=metrics(order).driverPay; order.earnings=pay!=null?pay:null;
    upsertOrder(order);
    openDetail(id);
    $('detail-ok').style.display='block';
  };
}
function openCatalogs(){
  $('catalogs-form').innerHTML=`
    <button class="secondary" id="cat-back">Назад</button>
    <h2 style="margin:0">Справочники</h2>
    <h3 style="margin:8px 0 0">Финансы / тариф</h3>
    <label>Наценка к себестоимости, %</label><input id="fin-markup" inputmode="decimal" value="${state.finance.markupPercent??15}" />
    <label>Порог города, км</label><input id="fin-city" inputmode="numeric" value="${state.finance.cityKmThreshold??100}" />
    <label>Мин. часов работы (город)</label><input id="fin-minwork" inputmode="decimal" value="${state.finance.minWorkHours??4}" />
    <label>Часов подачи</label><input id="fin-podacha" inputmode="decimal" value="${state.finance.podachaHours??1}" />
    <label>₽/час работы по умолчанию</label><input id="fin-perhour" inputmode="decimal" value="${state.finance.defaultRatePerHourWork||''}" />
    <label>₽/км нал по умолчанию</label><input id="fin-perkm" inputmode="decimal" value="${state.finance.defaultRatePerKmCash||''}" />
    <button class="primary" id="fin-save">Сохранить тариф</button>
    <div class="hint">Город ≤ порога: мин. часы + подача. Если нулевой×₽/км > подачи — добавляем ₽/км нулевого.</div>
    <h3 style="margin:8px 0 0">Заказчики</h3>
    ${state.customers.length?state.customers.map((c,i)=>`
      <div class="card" style="margin:8px 0">
        <h3 style="margin:0">${esc(c.name)}</h3>
        <div class="hint">Загрузки: ${(c.loadingAddresses||[]).length? (c.loadingAddresses||[]).map(esc).join(' · ') : '—'}</div>
        <div class="hint">Выгрузки: ${(c.unloadingAddresses||[]).length? (c.unloadingAddresses||[]).map(esc).join(' · ') : '—'}</div>
        <button type="button" class="secondary" data-del-cust="${i}">Удалить заказчика</button>
      </div>`).join(''):`<div class="hint">Появятся после сохранения заявок с заказчиком</div>`}
    <h3 style="margin:8px 0 0">Авто (л/100 км)</h3>
    ${state.vehicles.map((v,i)=>`<label>${esc(v.plate)}</label><div class="row"><input id="veh-${i}" inputmode="decimal" value="${v.consumptionPer100Km}" /><button data-save-veh="${i}">OK</button></div>`).join('')}
    <h3 style="margin:8px 0 0">Водители (% от ставки)</h3>
    ${state.drivers.map((d,i)=>`<label>${esc(d.name)}</label><div class="row"><input id="drv-${i}" inputmode="decimal" value="${d.salaryPercent}" /><button data-save-drv="${i}">OK</button></div>`).join('')}
    <div class="ok" id="cat-ok" style="display:none">Сохранено</div>
  `;
  show('admin-catalogs-screen');
  $('cat-back').onclick=()=>{ show('admin'); renderAdmin(); };
  document.querySelectorAll('[data-del-cust]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.delCust;
    state.customers.splice(i,1);
    persist();
    openCatalogs();
  });
  $('fin-save').onclick=()=>{
    let markup=+(($('fin-markup').value||'').replace(',','.')); if(Number.isNaN(markup)) markup=15;
    state.finance.markupPercent=Math.min(80, Math.max(0, markup));
    const city=+(($('fin-city').value||'').replace(/\D/g,'')); state.finance.cityKmThreshold=city>0?city:100;
    let minW=+(($('fin-minwork').value||'').replace(',','.')); if(!(minW>=0)) minW=4; state.finance.minWorkHours=minW;
    let pod=+(($('fin-podacha').value||'').replace(',','.')); if(!(pod>=0)) pod=1; state.finance.podachaHours=pod;
    let ph=+(($('fin-perhour').value||'').replace(',','.')); state.finance.defaultRatePerHourWork=(ph>0)?ph:0;
    let pk=+(($('fin-perkm').value||'').replace(',','.')); state.finance.defaultRatePerKmCash=(pk>0)?pk:0;
    persist();
    $('cat-ok').style.display='block';
  };
  document.querySelectorAll('[data-save-veh]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.saveVeh; const v=+(($('veh-'+i).value||'').replace(',','.')); if(!(v>0)) return; state.vehicles[i].consumptionPer100Km=v; persist(); $('cat-ok').style.display='block'; });
  document.querySelectorAll('[data-save-drv]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.saveDrv; const v=+(($('drv-'+i).value||'').replace(',','.')); if(!(v>=0)) return; state.drivers[i].salaryPercent=v; state.orders.filter(o=>o.driverName===state.drivers[i].name).forEach(o=>{ o.driverPercent=v; }); persist(); $('cat-ok').style.display='block'; });
}

function updateSyncHint(){
  const el=$('sync-hint'); if(!el) return;
  if(syncStatus==='ok') el.textContent='Общая база подключена — данные сохраняются на сервере';
  else if(syncStatus==='error') el.textContent='Нет связи с сервером — пока только локально в этом браузере';
  else if(syncStatus==='syncing') el.textContent='Подключение к общей базе…';
  else el.textContent='Локальный режим';
}
(async function boot(){
  await initCloudSync();
  updateSyncHint();
  setTimeout(()=>{ show('roles'); updateSyncHint(); }, 700);
})();
$('role-driver').onclick=()=>{ show('driver'); resetChat(); };
$('role-admin').onclick=()=>{ $('pin-input').value=''; $('pin-error').textContent=''; show('admin-pin'); };
$('pin-back').onclick=()=>show('roles');
$('pin-ok').onclick=()=>{ if(($('pin-input').value||'').trim()===ADMIN_PIN){ show('admin'); renderAdmin(); } else $('pin-error').textContent='Неверный PIN'; };
$('admin-exit').onclick=()=>show('roles');
$('admin-catalogs').onclick=openCatalogs;
$('driver-exit').onclick=()=>show('roles');
$('btn-cabinet').onclick=showCabinet;
$('btn-orders').onclick=showOrders;
$('btn-shifts').onclick=showShifts;
document.querySelectorAll('.back-driver').forEach(b=>{
  b.onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); hideDriverPanels(); };
});
document.querySelectorAll('#admin-filters button').forEach(b=>b.onclick=()=>{ state.adminFilter=b.dataset.filter; document.querySelectorAll('#admin-filters button').forEach(x=>x.classList.toggle('on', x===b)); renderAdmin(); });
bindAdminCreate();
</script>
</body>
